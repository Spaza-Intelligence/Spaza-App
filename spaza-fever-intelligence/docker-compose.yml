services:
  db:
    image: postgres:15
    container_name: spaza-intelligence-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-spaza_db}
      POSTGRES_USER: ${POSTGRES_USER:-spaza_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spaza_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - spaza_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spaza_user} -d ${POSTGRES_DB:-spaza_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "dev:server"]
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-spaza_user}:${POSTGRES_PASSWORD:-spaza_password}@db:5432/${POSTGRES_DB:-spaza_db}"
      SESSION_SECRET: ${SESSION_SECRET:?Create .env and set a random SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["pnpm", "dev:client"]
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  spaza_db_data:
